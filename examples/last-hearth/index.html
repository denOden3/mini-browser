<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Last Hearth — Tracker Demo</title>
  <style>
    :root { font-family:system-ui,-apple-system,sans-serif;color:#322b25;background:#faf7f0; }
    * { box-sizing:border-box; }
    body {margin:0;}
    header {padding:14px;background:#e8dfd0;border-bottom:1px solid #c8bba5;}
    h1 {font:700 22px Georgia,serif;margin:0 0 5px;}
    h2 {font-size:15px;margin:0 0 10px;}
    .sub,.note {font-size:11px;color:#756a5c;}
    .pill {display:inline-block;font-size:10px;color:#7c4a35;border:1px solid #b59b84;
      padding:3px 6px;border-radius:6px;margin-top:8px;}
    .quick {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;
      padding:10px;background:#f2ecdf;}
    .quick div {background:white;border:1px solid #e4dbcd;border-radius:8px;
      text-align:center;padding:8px 3px;}
    .quick b,.quick small {display:block;}
    .quick b {font-size:15px;}
    .quick small {font-size:10px;color:#776b61;}
    nav {display:flex;overflow-x:auto;gap:5px;padding:8px;border-bottom:1px solid #e1d8c8;}
    button {cursor:pointer;font:12px system-ui;background:white;border:1px solid #bdad97;
      border-radius:7px;padding:7px 9px;white-space:nowrap;color:#342d25;}
    button[aria-selected="true"] {background:#405a47;color:white;border-color:#405a47;}
    main {padding:14px 12px 20px;}
    .item {display:flex;justify-content:space-between;align-items:start;gap:8px;
      padding:10px 0;border-bottom:1px solid #e1d8cb;}
    .item strong {font-size:12px;}
    .item p {margin:4px 0 0;font-size:11px;color:#6d6258;}
    .item .value {font-weight:650;font-size:12px;white-space:nowrap;}
    footer {padding:10px;font-size:10px;color:#776b61;border-top:1px solid #ded5c8;}
    @media(max-height:240px) {
      header,nav,main,footer {display:none;}
      .quick {height:100dvh;display:grid;align-items:stretch;padding:6px;}
      .quick div {display:flex;flex-direction:column;align-items:center;justify-content:center;}
    }
  </style>
</head>
<body>
  <header>
    <h1>♨ The Last Hearth</h1>
    <div class="sub">Inn management · Day 6, afternoon</div>
    <span class="pill">STATIC DEMO · NOT CONNECTED TO DATABASE</span>
  </header>
  <section class="quick" aria-label="At a glance">
    <div><b>96c</b><small>Cash on hand</small></div>
    <div><b>Day 9</b><small>First payday</small></div>
    <div><b>Shop</b><small>Top priority</small></div>
  </section>
  <nav aria-label="Tracker pages">
    <button data-tab="tasks" aria-selected="true">Tasks</button>
    <button data-tab="treasury">Treasury</button>
    <button data-tab="staff">Staff</button>
    <button data-tab="storage">Storage</button>
  </nav>
  <main id="content"></main>
  <footer>This standalone webpage is a demo of what Mini displays.
    Later, a game-specific data connection will replace the static sample.</footer>
  <script>
    const pages = {
      tasks: [
        ["Provision shop", "Prioritized. Two good planks, eight brackets and drawer hardware needed."],
        ["Cold cellar", "Six stone blocks and four timber supports deposited; door and enchantment pending."],
        ["Running water", "Three pipes, two connectors, two valves, eight drainage stones needed."],
        ["Staff cottage", "Six of sixteen planks acquired; awaiting other materials."]
      ],
      treasury: [
        ["Cash on hand", "96 copper"],
        ["Payroll reserve", "40 copper"],
        ["Operating supplies reserve", "20 copper"],
        ["Bedframe reserve", "22 copper"],
        ["Development funds", "14 copper"],
        ["Garrick ore credit", "2 copper · not cash"]
      ],
      staff: [
        ["Mara", "Cook and tavern manager · 3c/workday"],
        ["Nell", "Waitress and product promoter · 1c/half-day, 2c/full-day"],
        ["Finn", "Stable and grounds · 1c/half-day, 2c/full-day"],
        ["Mistress Edith", "Potential bookkeeper · not yet employed"]
      ],
      storage: [
        ["Cellar stone blocks", "6 / 6 deposited"],
        ["Cellar timber supports", "4 / 4 deposited"],
        ["Frostvein Quartz", "Awaiting enchantment"],
        ["Cottage planks", "6 / 16 (awaiting deposit)"],
        ["Strawberry plants", "6 transplanted"]
      ]
    };
    const main = document.getElementById("content");
    const buttons = [...document.querySelectorAll("[data-tab]")];
    function show(name) {
      const h = document.createElement("h2");
      h.textContent = ({tasks:"Innkeeper's Tasks",treasury:"Treasury",staff:"Team",storage:"Materials"})[name];
      main.replaceChildren(h);
      for (const [label,description] of pages[name]) {
        const item = document.createElement("div");
        item.className = "item";
        const left = document.createElement("div");
        const strong = document.createElement("strong");
        const p = document.createElement("p");
        strong.textContent = label; p.textContent = description;
        left.append(strong,p); item.append(left); main.append(item);
      }
      for (const button of buttons) button.setAttribute("aria-selected", String(button.dataset.tab === name));
    }
    for (const button of buttons) button.addEventListener("click", () => show(button.dataset.tab));
    show("tasks");
  </script>
</body>
</html>
