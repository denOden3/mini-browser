<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263b34">
<title>Mini Library · Your story saves</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#26332e;background:#f6f3ec;--ink:#26332e;--forest:#31594c;--sage:#e8eee7;--border:#ded9cb;--muted:#69736d;--paper:#fffdf9;--gold:#c49a55}
*{box-sizing:border-box}body{margin:0;min-width:270px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid #bd8246;outline-offset:2px}
a{color:var(--forest)}[hidden]{display:none!important}.shell{max-width:1080px;margin:0 auto;padding:0 20px 44px}
.mast{background:var(--forest);color:#fff;box-shadow:0 3px 18px #17251b25}.mast .inner{max-width:1080px;margin:0 auto;padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.logo{display:flex;align-items:center;gap:12px;min-width:0}.sigil{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#f4ead5;color:#334d3d;font-size:22px;flex:none}.brand{font-family:Georgia,serif;font-size:22px;font-weight:700;letter-spacing:.015em;white-space:nowrap}.tagline{font-size:11px;opacity:.83;margin-top:2px}.mast .chip{font-size:11px;border:1px solid #e8e7d060;border-radius:99px;padding:6px 9px;white-space:nowrap}
.nav{display:flex;gap:8px;overflow:auto;padding:13px 0 3px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{border:1px solid var(--border);background:var(--paper);padding:9px 13px;border-radius:9px;color:#4d5a52;font-weight:650;white-space:nowrap;font-size:12px}.nav button[aria-current=page]{color:white;background:var(--forest);border-color:var(--forest)}
.hero{padding:26px 0 16px;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9d7b50}.hero h1{font-family:Georgia,serif;font-weight:700;font-size:clamp(25px,4vw,37px);margin:6px 0 6px}.hero p{font-size:13px;color:var(--muted);margin:0;max-width:560px;line-height:1.6}
.btn{border:1px solid var(--border);border-radius:9px;padding:9px 13px;background:#fffdf9;color:var(--ink);font-weight:650;font-size:12px;display:inline-flex;gap:7px;align-items:center;justify-content:center;min-height:38px}
.btn.primary{background:var(--forest);border-color:var(--forest);color:#fff}.btn.ghost{background:transparent}.btn.warn{border-color:#d8bcb0;color:#994938}.btn.slim{padding:7px 10px;min-height:32px;font-size:11px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:13px}
.panel,.gamecard{background:var(--paper);border:1px solid var(--border);border-radius:14px;box-shadow:0 3px 10px #211a1008}
.gamecard{padding:18px;display:flex;flex-direction:column;gap:14px;min-height:178px}.gamecard h2{font-family:Georgia,serif;font-size:20px;margin:0 0 5px}.gamecard p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.gamehead{display:flex;gap:11px;align-items:start}.gameicon{height:44px;width:44px;display:grid;place-items:center;background:#eff1e6;border-radius:10px;font-size:25px;flex:none}.gamehead .meta{font-size:11px;color:#a07948;margin-bottom:7px}.gamecard .actions{margin-top:auto}
.panel{padding:18px;margin-bottom:15px}.panel h2{font-family:Georgia,serif;font-size:21px;margin:0 0 10px}.panel h3{font-size:14px;margin:0 0 8px}.small{font-size:12px;color:var(--muted);line-height:1.55}.warning{background:#fff5e5;border:1px solid #e7d5b2;border-radius:10px;padding:10px 12px;color:#655039;font-size:12px;line-height:1.6;margin:16px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.stat{background:#f0f4eb;padding:11px 9px;border:1px solid #dfe7dc;border-radius:10px;min-width:0}.stat b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat small{font-size:10px;color:var(--muted);display:block;overflow-wrap:anywhere;margin-top:4px}
.label{font-size:12px;font-weight:700;margin:10px 0 5px;display:block}.field{width:100%;min-width:0;border-radius:9px;border:1px solid #cec9bd;background:#fff;color:var(--ink);padding:10px 11px;font-size:13px;line-height:1.5}.field:focus{border-color:#749987;outline:2px solid #e5efe5}.field.long{min-height:96px;resize:vertical}.field.prompt{min-height:280px;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
details.editor{background:#fffdf9;border:1px solid var(--border);border-radius:12px;margin:9px 0;padding:0 14px}details.editor>summary{cursor:pointer;font-weight:750;padding:14px 0;font-size:13px}details.editor[open]>summary{border-bottom:1px solid var(--border);margin-bottom:11px}.editor .hint{font-size:11px;color:var(--muted);margin:5px 0 12px}.editor .field{margin-bottom:12px}.divider{height:1px;background:var(--border);margin:14px 0}.checkpoint{font-size:13px;color:#55715e}.journal{display:grid;gap:8px}.entry{padding:11px;border:1px solid var(--border);border-radius:9px;background:#fff}.entry small{display:block;color:#967b58;font-size:10px;margin-bottom:5px}.entry p{white-space:pre-wrap;margin:0;font-size:12px;line-height:1.55}.entry .end{margin-top:8px;display:flex;justify-content:flex-end}
.filebutton{position:relative;overflow:hidden}.filebutton input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}.subtle{color:var(--muted)}.status{font-size:11px;color:var(--forest);font-weight:650}.foot{text-align:center;font-size:11px;color:var(--muted);margin:36px 0 0}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.empty{padding:30px 12px;text-align:center;border:1px dashed #bfbab0;border-radius:12px;font-size:13px;color:var(--muted)}
body.compact{background:#f6f3ec}body.compact .compact-shell{max-width:780px;margin:0 auto;padding:10px}.compact-card{background:#fffdf9;border:1px solid #d9d3c5;border-radius:10px;padding:10px}.compact-title{display:flex;justify-content:space-between;align-items:center;gap:7px;font-size:12px;font-weight:800}.compact-meta{font-size:10px;color:var(--muted)}.compact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}.compact-grid>div{background:#eaf0e8;text-align:center;padding:8px 3px;border-radius:7px;min-width:0}.compact-grid b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.compact-grid small{display:block;font-size:10px;color:#637167;overflow:hidden;text-overflow:ellipsis}.compact-link{display:block;text-align:center;font-size:11px;margin-top:7px}
@media(max-width:650px){.shell{padding:0 12px 28px}.mast .inner{padding:11px 12px}.brand{font-size:19px}.mast .chip{font-size:10px;padding:5px 7px}.sigil{width:34px;height:34px}.hero{padding:20px 0 14px}.panel{padding:14px}.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.gamecard{min-height:unset}.hero h1{font-size:27px}.nav button{padding:8px 10px}}
@media(max-width:360px){.brand{font-size:16px}.stats{gap:4px}.stat{padding:8px 5px}.stat b{font-size:13px}.mast .chip{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var KEY="mini-library-v1";
var CURRENT_SCHEMA=1;
var NOW=new Date().toISOString();
var emptyGame=function(name){
  return {
    id:"game-"+Date.now()+"-"+Math.random().toString(36).slice(2,6),
    title:name||"Untitled Adventure",
    icon:"📖",
    summary:"",
    checkpoint:"New adventure",
    protagonist:"",
    rules:"The user controls their player character's dialogue, decisions, and major actions. The narrator controls NPCs, surroundings, and consequences. Keep scenes concise and stop at decisions.",
    world:"",
    cast:"",
    scene:"",
    inventory:"",
    finances:"",
    quests:"",
    quickStats:"Day|1\nFocus|Starting\nFunds|—",
    events:[],
    updatedAt:NOW
  };
};
function starterGame(){
  var g=emptyGame("The Last Hearth");
  g.id="the-last-hearth";g.icon="🔥";
  g.summary="A cozy fantasy inn-management roleplay in the Greywood Forest.";
  g.checkpoint="Day 6 · Afternoon — Tobin's workshop";
  g.protagonist="Axel Leracion, 20, male, from Earth. His husband Vhaeroth (Vae/Vaevae) is an ancient black dragon. Axel runs the inn; Vae's personal hoard is never part of the inn treasury.";
  g.rules="Short, interactive fantasy narration. Do not invent Axel's speech, decisions, inventory changes, or successes; narrate NPCs and consequences, then stop for Axel's next choice. No unearned time skips. Affectionate, funny relationship with Vae; sensible economic stakes. The 50 m sanctuary prevents harm within its bounds. The Foraging Codex cannot identify unknown species or determine safety: experts must first identify/reference materials before Axel can magically log and find matches.";
  g.world="The Last Hearth is a restored Level 1 inn in Greywood Forest, near Brackenford and Bellwick. Ground floor: tavern, kitchen, pantry, private Axel/Vae bedroom, reception near the bedroom, planned Nell counter by entrance and L-shaped shelves by stairs. Upper floor: three repaired guest rooms, one occupied by Mara and Lottie. Outside: cleared road, free traveler well-water, two-stall stable, two garden beds with six strawberry plants, planned staff cottage and bathhouse. Room 0 under the kitchen contains a Waterheart crystal and an incomplete old plumbing system.";
  g.cast="Vhaeroth: loving, wealthy dragon husband; keeps hoard separate. Mara: cook, kitchen manager, mother of Lottie, paid 3c/full workday. Lottie: 6-year-old strawberry enthusiast. Nell: energetic waitress/promoter, paid 1c/half-day or 2c/full-day from Day 6. Finn: stablehand, 1c/half-day or 2c/full-day, began Day 4. Mistress Edith: proposed bookkeeper at 2c/half-day, NOT employed until shop opens. Tobin: carpenter, five bedframes ordered for 22c total, unpaid. Osric: mason, can produce drainage stones. Garrick: blacksmith, cellar iron fittings now 6c after 2c ore credit; 2 ventilation grilles fully bartered for charcoal. Bromli: dwarf dealer, six-meal furniture barter already fully settled. Elspeth: Brackenford headwoman.";
  g.scene="Day 6 afternoon, at Tobin's workshop in Brackenford. Axel chose to prioritize provision shelves and Nell's counter before staff-cottage timber, since shop income can fund construction. Tobin can use offcuts for four planks' worth of shelving and scraps for the counter body; still needs 2 good planks, 8 iron brackets, and drawer/lock hardware. Tobin has NOT yet quoted labor or bracket costs. Axel asked whether Garrick can make plumbing fittings; Tobin suggested showing Garrick an old connector, while Osric can make drainage stones. Vae suggested examining Room 0 for reusable existing pipes. Tobin offered to request a combined quote from Garrick. Continue at this decision point; do not decide Axel's response.";
  g.inventory="Cellar: 6/6 stone blocks and 4/4 timber supports deposited in storage shed. Two ventilation grilles owed by Garrick (charcoal barter settled); door not installed. Frostvein Quartz collected but NOT enchanted. Six staff-cottage planks acquired but awaiting deposit. Six wild strawberry plants growing in garden. Room 0 plumbing still needs 3 copper pipes, 2 connectors, 2 valves, 8 drainage stones, though salvage might reduce quantities. Five commissioned bedframes not delivered.";
  g.finances="96 copper cash on hand, reconciled after Day 5 (Day 6 sales uncounted). ALLOCATIONS, NOT EXPENSES: 40c payroll reserve, 20c operating supplies, 22c for Tobin's five bedframes, 14c development. As of Day 5: 9c accrued Mara wages + 3c Finn wages =12c accrued, NOT yet paid. Nell begins paid shifts Day 6. First payroll due Day 9. Cellar door still requires 6c iron fittings + 2c carpentry = 8c cash, unless further barter. Garrick's 2c ore credit is not cash. Ten copper = one silver; 100 copper = one gold. Vae's private wealth is separate.";
  g.quests="PRIORITY: Provision shop: 2 good planks, 8 brackets, drawer fittings, labor quote. Cold cellar: reinforced door, 2 ventilation grilles awaiting fabrication, enchant quartz, then confirm system upgrade. Plumbing: inspect old fittings and pipes, obtain missing components and 8 drainage stones. Staff cottage: 6/16 planks, 0/20 stones, 0/12 tiles, 0/4 panes; lower priority. Bathhouse awaits working plumbing. Tobin's 5 bedframes cost 22c on delivery.";
  g.quickStats="Cash|96c\nDay|6\nFocus|Shop";
  g.events=[
    {id:"e1",at:"Day 5 · Night",text:"Tavern receipts reconciled to 96c. Mara allocated 40c payroll, 20c supplies, 22c bedframes, 14c development. No reserve transfer was spending."},
    {id:"e2",at:"Day 6 · Afternoon",text:"Garrick accepted two sacks of charcoal for two cellar ventilation grilles and gave 2c credit for iron ore toward door fittings."},
    {id:"e3",at:"Day 6 · Afternoon",text:"Axel chose provision shelves ahead of cottage timber; asked Tobin about plumbing. Garrick may inspect an old connector; Osric can make drainage stones. Vae offered to inspect old pipes."}
  ];
  return g;
}
function freshLibrary(){return {schema:CURRENT_SCHEMA,active:"the-last-hearth",games:[starterGame()],snapshots:[]};}
function load(){
  try{
    var saved=JSON.parse(localStorage.getItem(KEY)||"null");
    if(saved&&Array.isArray(saved.games)&&saved.schema===1){
      saved.snapshots=Array.isArray(saved.snapshots)?saved.snapshots:[];
      return saved;
    }
  }catch(e){}
  return freshLibrary();
}
var db=load();
var view="library", active=db.active||db.games[0]?.id||null;
var params=new URLSearchParams(location.search);
if(params.has("game")&&db.games.some(function(g){return g.id===params.get("game");})){
  active=params.get("game");view="game";
}
var compact=params.get("view")==="compact";
var app=document.getElementById("app");
function current(){return db.games.find(function(g){return g.id===active;})||db.games[0]||null;}
function persist(){
  db.active=active;
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){showNotice("Browser storage is unavailable or full. Export a backup to protect your save.");}
}
function id(){return "entry-"+Date.now()+"-"+Math.random().toString(36).slice(2,7);}
function el(tag,className,text){
  var node=document.createElement(tag);
  if(className)node.className=className;
  if(text!==undefined)node.textContent=text;
  return node;
}
function append(parent){for(var i=1;i<arguments.length;i++)parent.append(arguments[i]);return parent;}
function button(text,fn,cls){var b=el("button","btn "+(cls||""),text);b.type="button";b.onclick=fn;return b;}
function noticeText(){return "Starter state imported from our roleplay recap. Review the save before using it as canon. Saves currently live in this browser only—not yet in an online database.";}
function updated(g){return g?.updatedAt?new Date(g.updatedAt).toLocaleString(): "Not saved";}
function statPairs(g){
  return String(g.quickStats||"").split(/\r?\n/).filter(Boolean).slice(0,6).map(function(v){
    var i=v.indexOf("|");return i===-1?["Stat",v.trim()]:[v.slice(0,i).trim(),v.slice(i+1).trim()];
  });
}
function go(next){view=next;render();}
function selectGame(gameId,next){
  if(!db.games.some(function(g){return g.id===gameId;}))return;
  active=gameId;persist();view=next||"game";render();
}
function showNotice(message){
  var old=document.getElementById("mini-notice");
  if(old)old.remove();
  var note=el("div","warning",message);note.id="mini-notice";
  if(app.firstChild)app.insertBefore(note,app.firstChild);else app.append(note);
}
function heading(container,eyebrow,title,description,actions){
  var hero=el("section","hero"),left=el("div");
  append(left,el("div","eyebrow",eyebrow),el("h1","",title),el("p","",description));
  hero.append(left);
  if(actions)hero.append(actions);
  container.append(hero);
}
function shell(){
  document.body.classList.remove("compact");
  var header=el("header","mast"),inner=el("div","inner");
  var logo=el("div","logo"),symbol=el("div","sigil","✦"),words=el("div");
  append(words,el("div","brand","Mini Library"),el("div","tagline","Your stories, safely carried between chats"));
  append(logo,symbol,words);
  append(inner,logo,el("div","chip","LOCAL SAVE · v0.1"));
  header.append(inner);
  var main=el("main","shell");
  var nav=el("nav","nav");nav.setAttribute("aria-label","Mini pages");
  [["library","Library"],["game","Game Save"],["prompt","Play / Prompt"],["backups","Backups"]].forEach(function(item){
    var b=el("button","",item[1]);
    b.type="button";b.setAttribute("aria-current",item[0]===view?"page":"false");
    b.onclick=function(){go(item[0]);};nav.append(b);
  });
  main.append(nav);
  app.replaceChildren(header,main);
  return main;
}
function gameCards(parent){
  var grid=el("div","grid");
  db.games.forEach(function(g){
    var card=el("article","gamecard"),head=el("div","gamehead"),icon=el("div","gameicon",g.icon||"📖"),words=el("div");
    append(words,el("div","meta",g.checkpoint||"New story"),el("h2","",g.title),el("p","",g.summary||"A new story awaiting its first chapter."));
    append(head,icon,words);card.append(head);
    var actions=el("div","actions");
    append(actions,button("Open Save",function(){selectGame(g.id,"game");},"primary"),
      button("Generate Prompt",function(){selectGame(g.id,"prompt");}));
    append(card,actions);grid.append(card);
  });
  parent.append(grid);
}
function renderLibrary(main){
  var acts=el("div","actions");acts.append(button("＋ New Game",createGame,"primary"));
  heading(main,"THE GAME SHELF","Every adventure has a home.","Save canon, progress, and continuation prompts independently of the length of a ChatGPT conversation.",acts);
  var warning=el("div","warning",noticeText());main.append(warning);
  gameCards(main);
}
function summaryCard(main,g){
  var card=el("section","panel");
  var row=el("div","toolbar");
  append(row,el("div","checkpoint",g.checkpoint),button("Continue this game",function(){go("prompt");},"primary"));
  card.append(row);
  var stats=el("div","stats");
  statPairs(g).slice(0,3).forEach(function(pair){
    var box=el("div","stat");
    append(box,el("b","",pair[1]||"—"),el("small","",pair[0]||"Stat"));stats.append(box);
  });
  card.append(stats);
  append(card,el("div","small",g.summary||"No story summary yet."));
  main.append(card);
}
var fields=[
  ["identity","Identity & style",[["title","Game title",false],["icon","Game icon (emoji)",false],["summary","One-line description",true],["checkpoint","Current day / checkpoint",false],["quickStats","Compact tracker stats: label|value, one per line",true]]],
  ["canon","Characters & game rules",[["protagonist","Player character",true],["rules","Narration rules and boundaries",true],["world","World and permanent canon",true],["cast","Important NPCs and relationships",true]]],
  ["state","Current state",[["scene","Where the story is paused",true],["inventory","Inventory & known resources",true],["finances","Treasury, commitments, and debts",true],["quests","Projects, quests, and priorities",true]]]
];
function renderGame(main){
  var g=current();if(!g)return emptyGamePanel(main);
  var actions=el("div","actions");
  append(actions,button("Generate Continuation",function(){go("prompt");},"primary"),
    button("Save Point",snapshotCurrent));
  heading(main,"ACTIVE SAVE",g.title,"Edit the current story facts here. Changes save locally while you type.",actions);
  summaryCard(main,g);
  var note=el("p","small","Changes autosave in this browser. The roleplay itself does not automatically update these fields yet.");
  main.append(note);
  fields.forEach(function(section,index){
    var wrap=el("details","editor");if(index===0)wrap.open=true;
    wrap.append(el("summary","",section[1]));
    section[2].forEach(function(field){
      var label=el("label","label",field[1]);label.htmlFor="fld-"+field[0];
      var input=el(field[2]?"textarea":"input","field"+(field[2]?" long":""));
      if(!field[2])input.type="text";
      input.id="fld-"+field[0];input.value=g[field[0]]||"";
      input.addEventListener("input",function(){
        g[field[0]]=input.value;
        g.updatedAt=new Date().toISOString();
        persist();
        var saved=document.getElementById("save-signal");
        if(saved)saved.textContent="Saved in this browser";
      });
      append(wrap,label,input);
    });
    main.append(wrap);
  });
  var saved=el("div","status","Saved in this browser");saved.id="save-signal";main.append(saved);
  renderJournal(main,g);
}
function emptyGamePanel(main){
  heading(main,"NO SAVE SELECTED","No active game yet","Choose a game from your library to begin.");
  main.append(button("Open Library",function(){go("library");},"primary"));
}
function renderJournal(main,g){
  var panel=el("section","panel");
  append(panel,el("h2","","Event Journal"),
    el("p","small","Record significant in-story changes. The latest five entries will also appear in your continuation prompt."));
  var timeInput=el("input","field");timeInput.type="text";timeInput.placeholder="Day 6 · Evening";
  var entryInput=el("textarea","field long");entryInput.placeholder="What happened? Include what was earned, spent, promised, delivered, or completed.";
  append(panel,el("label","label","When"),timeInput,el("label","label","What changed"),entryInput);
  panel.append(button("＋ Add event",function(){
    var message=entryInput.value.trim();
    if(!message){entryInput.focus();return;}
    g.events=g.events||[];g.events.push({id:id(),at:timeInput.value.trim()||"Undated",text:message});
    g.updatedAt=new Date().toISOString();persist();render();
  },"primary"));
  var list=el("div","journal");
  (g.events||[]).slice(-12).reverse().forEach(function(event){
    var row=el("div","entry"),end=el("div","end");
    append(row,el("small","",event.at||"Undated"),el("p","",event.text||""));
    end.append(button("Remove",function(){
      if(!confirm("Remove this event from the saved journal?"))return;
      g.events=g.events.filter(function(e){return e.id!==event.id;});persist();render();
    },"slim warn"));append(row,end);list.append(row);
  });
  if(!(g.events||[]).length)list.append(el("p","small","No events recorded yet."));
  append(panel,el("div","divider"),list);main.append(panel);
}
function composePrompt(g,extra){
  var journal=(g.events||[]).slice(-5).map(function(e){return "- "+(e.at||"Undated")+": "+(e.text||"");}).join("\n");
  var bits=[
    "MINI LIBRARY — CONTINUATION SAVE v1",
    "GAME: "+g.title,
    "CHECKPOINT: "+(g.checkpoint||"Not recorded"),
    "SUMMARY: "+(g.summary||"Not recorded"),
    "",
    "ROLEPLAY CONTRACT",
    g.rules||"The user controls their player character. Keep narration interactive.",
    "",
    "PLAYER CHARACTER & KEY RELATIONSHIPS",
    g.protagonist||"Not recorded",
    "",
    "WORLD & PERMANENT CANON",
    g.world||"Not recorded",
    "",
    "NPCS & RELATIONSHIPS",
    g.cast||"Not recorded",
    "",
    "CURRENT SCENE — RESUME HERE",
    g.scene||"Not recorded",
    "",
    "RESOURCES & INVENTORY",
    g.inventory||"Not recorded",
    "",
    "TREASURY / COMMITMENTS",
    g.finances||"Not recorded",
    "",
    "OPEN PROJECTS / QUESTS",
    g.quests||"Not recorded",
    "",
    "MOST RECENT CONFIRMED EVENTS",
    journal||"No events logged.",
    "",
    "NEXT INSTRUCTION",
    "Treat the saved facts above as the current checkpoint, not new events to repeat. Do not invent player-character actions or silently advance construction, money, or inventory. Stay at the current scene, briefly establish any necessary NPC/world reaction, and stop for my next action. If a material fact is uncertain, leave it unresolved rather than assuming it."
  ];
  if(extra&&extra.trim())bits.push("","ADDITIONAL INSTRUCTIONS FOR THIS SESSION",extra.trim());
  return bits.join("\n");
}
function renderPrompt(main){
  var g=current();if(!g)return emptyGamePanel(main);
  heading(main,"CONTINUATION PROMPT","Resume "+g.title,"Generate a context packet for a fresh ChatGPT conversation—even if the old chat reaches its limit.");
  var p=el("section","panel");
  append(p,el("h2","","Ready to play?"),
    el("p","small","This prompt uses your latest saved fields and the five newest journal events. Review the checkpoint before copying."));
  var extra=el("textarea","field long");extra.placeholder="Optional: Tell the narrator what to emphasize this session.";
  var output=el("textarea","field prompt");output.readOnly=true;output.setAttribute("aria-label","Generated continuation prompt");
  var status=el("p","status","");status.id="copy-status";
  var actions=el("div","actions");
  var regenerate=function(){output.value=composePrompt(g,extra.value);status.textContent="Prompt regenerated from current saved state.";};
  append(actions,
    button("↻ Regenerate",regenerate),
    button("Copy continuation prompt",async function(){
      var success=false;
      try{
        if(navigator.clipboard&&navigator.clipboard.writeText){
          await navigator.clipboard.writeText(output.value);success=true;
        }
      }catch(e){}
      if(!success){
        output.focus();output.select();
        try{success=document.execCommand("copy");}catch(e){}
      }
      status.textContent=success?"Copied! Paste into a new ChatGPT conversation.":"Select and copy the prompt manually from the box below.";
    },"primary"));
  var chat=document.createElement("a");chat.className="btn";chat.href="https://chatgpt.com/";chat.target="_blank";
  chat.rel="noopener noreferrer";chat.textContent="Open ChatGPT";
  actions.append(chat);
  append(p,el("label","label","Session-specific instructions"),extra,
    el("label","label","Your continuation prompt"),output,actions,status);
  main.append(p);
  var tip=el("div","warning","When you start a fresh chat: copy the prompt, open ChatGPT, paste, and send. The website cannot silently import your chat history or update itself after narration yet.");
  main.append(tip);regenerate();status.textContent="";
}
function createGame(){
  var name=prompt("Name of your new game:","New Adventure");
  if(name===null)return;
  name=name.trim()||"New Adventure";
  var g=emptyGame(name);db.games.push(g);active=g.id;persist();view="game";render();
}
function downloadJSON(payload,filename){
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function snapshotCurrent(){
  var g=current();if(!g)return;
  db.snapshots=db.snapshots||[];
  db.snapshots.push({id:id(),gameId:g.id,at:new Date().toISOString(),checkpoint:g.checkpoint,
    game:JSON.parse(JSON.stringify(g))});
  if(db.snapshots.length>20)db.snapshots=db.snapshots.slice(-20);
  persist();showNotice("Save point created. You can restore it from Backups.");
}
function restoreSnapshot(item){
  if(!confirm("Restore "+item.checkpoint+"? This replaces the current saved facts for that game."))return;
  var index=db.games.findIndex(function(g){return g.id===item.gameId;});
  if(index===-1){db.games.push(JSON.parse(JSON.stringify(item.game)));}
  else db.games[index]=JSON.parse(JSON.stringify(item.game));
  active=item.gameId;persist();view="game";render();
}
function importBackup(file){
  if(!file)return;
  if(file.size>2*1024*1024){showNotice("File too large (2 MB maximum).");return;}
  var reader=new FileReader();
  reader.onerror=function(){showNotice("Could not read this backup.");};
  reader.onload=function(){
    var data;try{data=JSON.parse(reader.result);}catch(e){showNotice("Invalid JSON backup.");return;}
    if(data&&data.schema===1&&Array.isArray(data.games)){
      if(!confirm("Replace this browser's Mini Library with the imported backup? Export your existing saves first if needed."))return;
      db={schema:1,active:data.active||data.games[0]?.id||null,
        games:data.games.filter(function(g){return g&&typeof g.id==="string"&&typeof g.title==="string"&&Array.isArray(g.events||[]);}).slice(0,100),
        snapshots:Array.isArray(data.snapshots)?data.snapshots.slice(-20):[]};
      active=db.active;persist();view="library";render();return;
    }
    if(data&&data.game&&typeof data.game.title==="string"){
      var game=data.game;game.id=game.id||("import-"+Date.now());
      var exists=db.games.findIndex(function(g){return g.id===game.id;});
      if(exists!==-1&& !confirm("Overwrite existing save for "+game.title+"?"))return;
      if(exists!==-1)db.games[exists]=game;else db.games.push(game);
      active=game.id;persist();view="game";render();return;
    }
    showNotice("This file is not a supported Mini Library backup.");
  };
  reader.readAsText(file);
}
function renderBackups(main){
  var g=current();heading(main,"KEEP YOUR STORIES","Save points & backups",
    "Protect your story continuity. Exporting a JSON file also lets you move saves between browsers until cloud sync is ready.");
  var box=el("section","panel");
  append(box,el("h2","","Backup tools"),
    el("p","small","Local browser storage can disappear when browser data is cleared. Export regularly, especially before changing devices."));
  var actions=el("div","actions");
  append(actions,
    button("Export entire library",function(){downloadJSON(db,"mini-library-backup.json");},"primary"),
    button("Export current game",function(){
      if(!g)return;downloadJSON({schema:1,game:g},(g.id||"game")+"-save.json");
    }),
    button("Create save point",snapshotCurrent));
  var label=el("label","btn filebutton","Import JSON backup");
  var file=el("input");file.type="file";file.accept=".json,application/json";
  file.addEventListener("change",function(){importBackup(file.files[0]);file.value="";});
  label.append(file);actions.append(label);
  append(box,actions);main.append(box);
  var history=el("section","panel");history.append(el("h2","","Local save points"));
  if(!db.snapshots?.length)history.append(el("p","small","No restore points yet."));
  (db.snapshots||[]).slice().reverse().forEach(function(item){
    var row=el("div","entry"),bar=el("div","toolbar");
    append(bar,el("div","small",(item.game?.title||"Game")+" · "+(item.checkpoint||"Checkpoint")),
      button("Restore",function(){restoreSnapshot(item);},"slim"));
    append(row,bar,el("div","subtle small",new Date(item.at).toLocaleString()));history.append(row);
  });
  main.append(history);
}
function renderCompact(){
  document.body.classList.add("compact");
  var g=current();app.replaceChildren();
  if(!g){app.append(el("p","small","No saved game yet."));return;}
  var shell=el("div","compact-shell"),card=el("div","compact-card"),head=el("div","compact-title");
  append(head,el("span","",(g.icon||"📖")+" "+g.title),el("span","compact-meta",g.checkpoint||""));
  card.append(head);
  var grid=el("div","compact-grid");
  statPairs(g).slice(0,3).forEach(function(pair){var cell=el("div");append(cell,el("b","",pair[1]||"—"),el("small","",pair[0]));grid.append(cell);});
  card.append(grid);
  var link=el("a","compact-link","Open full save / Generate prompt");
  link.href="?game="+encodeURIComponent(g.id);link.target="_blank";link.rel="noopener";
  card.append(link);shell.append(card);app.append(shell);
}
function render(){
  if(compact){renderCompact();return;}
  var main=shell();
  if(view==="library")renderLibrary(main);
  else if(view==="game")renderGame(main);
  else if(view==="prompt")renderPrompt(main);
  else if(view==="backups")renderBackups(main);
  main.append(el("footer","foot","Mini Library · Static offline-first prototype · No automatic ChatGPT synchronization yet"));
}
persist();render();
})();
</script>
<!-- Mini HUD readiness handshake: sends no story data or credentials. -->
<script>
(function () {
  if (window.parent === window) return;
  var app = document.getElementById("app");
  if (!app || !app.children.length) return;
  window.parent.postMessage({type:"mini-browser:page-ready",version:1}, "*");
})();
</script>
